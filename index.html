<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Calcolatore di markup e prezzi: costo, ricarico, margine, IVA, sconti e arrotondamenti in un unico strumento." />
  <title>Markup Calculator</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#17150f" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Markup" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&f[]=zodiak@400,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main id="app">
    <div class="card">

      <header class="topbar">
        <div class="brand">
          <span class="mark" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="7" y1="16" x2="16" y2="7"/><circle cx="8" cy="8" r="2.2"/><circle cx="15.5" cy="15.5" r="2.2"/>
            </svg>
          </span>
          <span class="brand-text">
            <span class="brand-name">Markup</span>
            <span class="brand-sub">Calcolatore prezzi</span>
          </span>
        </div>
        <div class="topbar-actions">
          <button type="button" class="icon-btn" id="btnCopy" aria-label="Copia riepilogo" title="Copia riepilogo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
          <button type="button" class="icon-btn" id="btnReset" aria-label="Azzera tutto" title="Azzera tutto">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.36 2.64L3 8"/><path d="M3 3v5h5"/>
            </svg>
          </button>
          <button type="button" class="icon-btn" data-theme-toggle aria-label="Cambia tema" title="Cambia tema">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="calc">
        <div class="field">
          <label for="costo">Costo</label>
          <div class="entry">
            <input type="text" inputmode="decimal" id="costo" placeholder="100" autocomplete="off">
            <span class="unit">€</span>
          </div>
        </div>
        <div class="field markup-field">
          <label for="markup">Markup</label>
          <div class="entry">
            <input type="text" inputmode="decimal" id="markup" placeholder="30" autocomplete="off">
            <span class="unit">%</span>
          </div>
        </div>
        <div class="field">
          <label for="prezzo">Prezzo</label>
          <div class="entry">
            <input type="text" inputmode="decimal" id="prezzo" placeholder="130" autocomplete="off">
            <span class="unit">€</span>
          </div>
        </div>
      </div>

      <div class="round-row" id="roundRow" hidden>
        <span class="round-label">Arrotonda a</span>
        <div class="round-chips">
          <button type="button" data-round="90">,90</button>
          <button type="button" data-round="99">,99</button>
          <button type="button" data-round="50">,50</button>
          <button type="button" data-round="int">intero</button>
        </div>
      </div>

      <div class="results-row">
        <span class="badge neutral" id="badgeMarkup"><span class="dot"></span><span id="badgeMarkupText">—</span></span>
        <span class="badge positive" id="badgeMargine"><span class="dot"></span><span id="badgeMargineText">—</span></span>
        <span class="badge neutral" id="badgeGuadagno"><span class="dot"></span><span id="badgeGuadagnoText">—</span></span>
      </div>

      <p class="hint" id="hint">Inserisci due valori — il terzo viene calcolato automaticamente.</p>

      <div class="sections">
        <details class="quota-section">
          <summary>IVA</summary>
          <div class="quota-body">
            <div class="quota-row">
              <div class="quota-field">
                <label for="ivaPercent">Aliquota %</label>
                <input type="text" inputmode="decimal" id="ivaPercent" placeholder="22" autocomplete="off">
              </div>
              <div class="quota-field">
                <label>Aliquote comuni</label>
                <div class="presets" id="ivaPresets">
                  <button type="button" data-iva="22">22%</button>
                  <button type="button" data-iva="10">10%</button>
                  <button type="button" data-iva="4">4%</button>
                </div>
              </div>
            </div>
            <p class="hint" id="hintIva"></p>
          </div>
        </details>

        <details class="quota-section">
          <summary>Sconto e trattativa</summary>
          <div class="quota-body">
            <div class="quota-row">
              <div class="quota-field">
                <label for="scontoPercent">Sconto %</label>
                <input type="text" inputmode="decimal" id="scontoPercent" placeholder="10" autocomplete="off">
              </div>
              <div class="quota-field">
                <label for="margineTarget">Margine minimo %</label>
                <input type="text" inputmode="decimal" id="margineTarget" placeholder="20" autocomplete="off">
              </div>
            </div>
            <p class="hint" id="hintSconto"></p>
            <p class="hint" id="hintMinimo"></p>
          </div>
        </details>

        <details class="quota-section">
          <summary>Quantità e totale</summary>
          <div class="quota-body">
            <div class="quota-row">
              <div class="quota-field">
                <label for="quantita">Quantità</label>
                <input type="text" inputmode="decimal" id="quantita" placeholder="1" autocomplete="off">
              </div>
              <div class="quota-field"></div>
            </div>
            <p class="hint" id="hintTotale"></p>
          </div>
        </details>

        <details class="quota-section">
          <summary>Quota consorzio</summary>
          <div class="quota-body">
            <div class="quota-row">
              <div class="quota-field">
                <label for="quotaPercent">Quota %</label>
                <input type="text" inputmode="decimal" id="quotaPercent" placeholder="5" autocomplete="off">
              </div>
              <div class="quota-field">
                <label for="quotaDesc">Descrizione</label>
                <input type="text" id="quotaDesc" placeholder="es. Consorzio XYZ" autocomplete="off">
              </div>
            </div>
            <p class="hint" id="hintQuota"></p>
          </div>
        </details>
      </div>

    </div>

    <p class="footnote">Calcolo istantaneo · funziona offline</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
