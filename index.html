<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markup Calculator</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <button class="toggle-btn" data-theme-toggle aria-label="Cambia tema">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <div id="app">

    <!-- LOGIN -->
    <div id="loginCard" class="card login-card">
      <p class="card-title">Markup Calculator</p>
      <button id="loginBtn" class="login-btn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Accedi con Google
      </button>
    </div>

    <!-- CALCULATOR -->
    <div id="calcCard" class="card" style="display:none;">
      <div class="card-header">
        <p class="card-title">Calcolatore Markup</p>
        <button id="logoutBtn" class="logout-btn">Esci</button>
      </div>

      <div class="calc-row">
        <div class="field">
          <label for="costo">Costo</label>
          <input type="number" id="costo" placeholder="100" inputmode="decimal" min="0" step="any">
          <span class="unit">€</span>
        </div>
        <div class="sep"></div>
        <div class="field markup-field">
          <label for="markup">Markup</label>
          <input type="number" id="markup" placeholder="30" inputmode="decimal" step="any">
          <span class="unit">%</span>
        </div>
        <div class="sep"></div>
        <div class="field">
          <label for="prezzo">Prezzo</label>
          <input type="number" id="prezzo" placeholder="130" inputmode="decimal" min="0" step="any">
          <span class="unit">€</span>
        </div>
      </div>

      <div class="results-row">
        <span class="badge neutral" id="badgeMarkup"><span class="dot"></span><span id="badgeMarkupText">—</span></span>
        <span class="badge positive" id="badgeMargine"><span class="dot"></span><span id="badgeMargineText">—</span></span>
        <span class="badge neutral" id="badgeGuadagno"><span class="dot"></span><span id="badgeGuadagnoText">—</span></span>
      </div>

      <p class="hint" id="hint">Inserisci due valori — il terzo viene calcolato automaticamente.</p>

      <details class="quota-section">
        <summary>Quota consorzio</summary>
        <div class="quota-body">
          <div class="quota-row">
            <div class="quota-field">
              <label for="quotaPercent">Quota %</label>
              <input type="number" id="quotaPercent" placeholder="5" inputmode="decimal" min="0" max="100" step="any">
            </div>
            <div class="quota-field">
              <label for="quotaDesc">Descrizione</label>
              <input type="text" id="quotaDesc" placeholder="es. Consorzio XYZ">
            </div>
          </div>
          <p class="hint" id="hintQuota"></p>
        </div>
      </details>

    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
